<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Blueprint Roblox Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
  <body>
    <div class="main">
      <div class="tools">
        <button id="run-code-btn" class="toolbar-btn primary">
          <i class="fas fa-play"></i> Run Code
        </button>
        <button id="save-code-btn" class="toolbar-btn secondary">
          <i class="fas fa-save"></i> Save
        </button>
        <button id="load-code-btn" class="toolbar-btn secondary">
          <i class="fas fa-folder-open"></i> Load
        </button>
      </div>

      <div class="content">
        <div class="explorer">
          <div class="sub-explorer-scripts">
            <div class="header-container">
              <h1>Scripts</h1>
              <button class="btn-add" id="scripts">+</button>
            </div>
          </div>
          <div class="sub-explorer-variables">
            <div class="header-container">
              <h1>Variables</h1>
              <button class="btn-add" id="variables">+</button>
            </div>
            <div class="variables-content" id="variables-content">
            </div>
          </div>
        </div>

        <div id="editor" class="editor">
          <button id="reset-editor" class="btn-editor-reset">Reset View</button>
          <div id="editor-background"></div>

          <svg id="connections" class="connections-layer"></svg>

          <div id="editor-content">

          </div>
        </div>

      </div>
    </div>

    <div id="result-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generated Luau Code</h2>
                <button class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="luau-code-output"></pre>
                <div class="modal-simulation-output">
                    <h3>Simulation Output:</h3>
                    <p id="simulation-output"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/variables.js"></script>
    <script src="js/editor_moving.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/tools.js"></script>
  </body>
</html>
